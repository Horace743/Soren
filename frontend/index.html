<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Coloration syntaxique des blocs de code (thème custom appliqué via style.css, pas le thème par défaut) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="orb online" id="orb"></div>
        <div class="brand-text">
          <h1>Soren</h1>
          <span class="tagline" id="tagline">plusieurs IA, une seule voix</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="history-btn" class="icon-btn" title="Historique des conversations" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15 15"></polyline>
          </svg>
        </button>
        <button id="clear-btn" class="icon-btn" title="Nouvelle conversation" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v5h5"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="history-backdrop" id="history-backdrop"></div>
    <aside class="history-panel" id="history-panel">
      <div class="history-panel-header">
        <h2>Conversations</h2>
        <button id="history-close-btn" class="icon-btn" title="Fermer" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty" id="history-empty">Aucune conversation pour l'instant.</div>
      </div>
    </aside>

    <main id="chat-window" class="chat-window">
      <div class="message assistant">
        <div class="bubble">Bon. Je t'écoute. Essaie d'être clair, pour une fois.</div>
      </div>
    </main>

    <div class="typing-row" id="typing-row" hidden>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>

    <form id="chat-form" class="chat-form">
      <textarea
        id="message-input"
        placeholder="Écris ton message..."
        autocomplete="off"
        rows="1"
        required
      ></textarea>
      <button type="submit" id="send-btn" class="send-btn" title="Envoyer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
